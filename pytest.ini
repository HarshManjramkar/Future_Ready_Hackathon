[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Fast unit tests for core algorithms and models
    integration: REST API and state mutation integration tests
    security: Anti-cheat, injection, and security boundary tests
    nfr: Performance, stress, and latency benchmark tests
